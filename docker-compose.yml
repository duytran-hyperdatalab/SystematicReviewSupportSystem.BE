name: srss-project

services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: srss-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1709
      - POSTGRES_DB=SRSS.IAM
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SRSS.IAM"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: srss-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srss-backend
    restart: always
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./SRSS.IAM/SRSS.IAM.API/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SRSS_IAM_DB=Host=db;Port=5432;Username=postgres;Password=1709;Database=SRSS.IAM
      - ConnectionStrings__Redis=redis:6379,allowAdmin=true,connectTimeout=10000,syncTimeout=10000,asyncTimeout=10000,connectRetry=5,abortConnect=false,keepAlive=60
      - CorsSettings__AllowedOrigins=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:5174

volumes:
  postgres_data:
